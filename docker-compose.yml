name: tlc-streaming

services:
  redpanda:
    image: redpandadata/redpanda:latest
    # Dois listeners: o externo (9092) é anunciado como localhost para o host;
    # o interno (29092) é anunciado como "redpanda" para o Console, dentro da rede.
    command: >
      redpanda start
      --smp 1
      --overprovisioned
      --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      --advertise-kafka-addr PLAINTEXT://localhost:9092,INTERNAL://redpanda:29092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - rp-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: streaming
    ports:
      - "5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streaming"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rp-data:
  pg-data:
